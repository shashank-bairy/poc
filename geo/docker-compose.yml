services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: geo-postgis
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: geo
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d geo"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: geo-redis
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  aerospike:
    image: aerospike/aerospike-server:8.1.2.5
    container_name: geo-aerospike
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD-SHELL", "asinfo -v build || exit 1"]
      interval: 5s
      retries: 30

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: geo-elastic
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    ports: ["9201:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      retries: 40
